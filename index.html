<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>FinStack</title>
  <meta name="description" content="FinStack — a private, local-first view of your net worth, budget and reserves.">
  <meta name="theme-color" content="#0d0d0d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon.svg?v=6" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icon.svg?v=6">
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem('finstack.theme'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <script src="js/fonts.js?v=6"></script>
  <link rel="stylesheet" href="css/styles.css?v=6">
</head>
<body class="booting">

  <!-- Opening animation -->
  <div id="splash" role="img" aria-label="FinStack">
    <div class="splash-inner">
      <svg class="mark splash-logo" viewBox="0 0 64 64" aria-hidden="true"><rect class="blk" x="8" y="52" width="12" height="8" rx="2.5" opacity=".38" style="--d:0"/><rect class="blk" x="8" y="41" width="12" height="8" rx="2.5" opacity=".38" style="--d:1"/><rect class="blk" x="26" y="52" width="12" height="8" rx="2.5" opacity=".68" style="--d:2"/><rect class="blk" x="26" y="41" width="12" height="8" rx="2.5" opacity=".68" style="--d:3"/><rect class="blk" x="26" y="30" width="12" height="8" rx="2.5" opacity=".68" style="--d:4"/><rect class="blk" x="44" y="52" width="12" height="8" rx="2.5" style="--d:5"/><rect class="blk" x="44" y="41" width="12" height="8" rx="2.5" style="--d:6"/><rect class="blk" x="44" y="30" width="12" height="8" rx="2.5" style="--d:7"/><rect class="blk" x="44" y="19" width="12" height="8" rx="2.5" style="--d:8"/><circle class="coin" cx="50" cy="10.5" r="4.5" style="--d:9"/></svg>
      <div class="splash-word" aria-hidden="true">
        <span>F</span><span>i</span><span>n</span><span class="w2">S</span><span class="w2">t</span><span class="w2">a</span><span class="w2">c</span><span class="w2">k</span>
      </div>
      <div class="splash-tag">Your money, in one calm place</div>
      <div class="splash-bar"><i></i></div>
    </div>
  </div>

  <header class="topbar">
    <button class="icon-btn" id="menu-btn" aria-label="Open menu" aria-expanded="false" aria-controls="drawer">
      <span class="burger"><i></i><i></i><i></i></span>
    </button>
    <a class="brand" href="#/dashboard" aria-label="FinStack home">
      <svg class="mark" viewBox="0 0 64 64" aria-hidden="true"><rect x="8" y="52" width="12" height="8" rx="2.5" opacity=".38"/><rect x="8" y="41" width="12" height="8" rx="2.5" opacity=".38"/><rect x="26" y="52" width="12" height="8" rx="2.5" opacity=".68"/><rect x="26" y="41" width="12" height="8" rx="2.5" opacity=".68"/><rect x="26" y="30" width="12" height="8" rx="2.5" opacity=".68"/><rect x="44" y="52" width="12" height="8" rx="2.5"/><rect x="44" y="41" width="12" height="8" rx="2.5"/><rect x="44" y="30" width="12" height="8" rx="2.5"/><rect x="44" y="19" width="12" height="8" rx="2.5"/><circle cx="50" cy="10.5" r="4.5"/></svg>
      <span>Fin<b>Stack</b></span>
    </a>
    <button class="icon-btn" id="eye-all" aria-label="Show all amounts" aria-pressed="false"></button>
  </header>

  <div id="scrim" hidden></div>
  <aside id="drawer" aria-label="Menu" inert>
    <div class="drawer-head">
      <span class="drawer-title">Menu</span>
      <button class="icon-btn" id="menu-close" aria-label="Close menu"></button>
    </div>
    <nav id="nav"></nav>
    <div class="drawer-foot" id="drawer-foot"></div>
  </aside>

  <main id="view" tabindex="-1"></main>

  <button class="fab" id="fab" data-action="spend-add" aria-label="Add spend" hidden></button>
  <div id="modal-root"></div>
  <div id="toast-root" aria-live="polite"></div>
  <input type="file" id="file-input" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden>

  <script src="js/xlsx-lite.js?v=6"></script>
  <script src="js/data.js?v=6"></script>
  <script src="js/config.js?v=6"></script>
  <script src="js/cloud.js?v=6"></script>
  <script src="js/app.js?v=6"></script>
</body>
</html>
